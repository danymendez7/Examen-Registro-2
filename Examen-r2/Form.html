<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=devicewidth, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registration</title>
</head>
<body> 
    <div class="container">
            <h2>REGISTRATION</h2>

    <form action="#" method="GET">
            
            <div class="form-group">
                <label for="full name">Full Name:</label>
                <input type="text" id="full name" placeholder="Ej.Daniela Mendez" required>
            </div>
            <div class="form-group">    
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Ej.dxnn.jtx" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Ej.daniela@example.com" required>
            </div>
            <div class="form-group">
                <label for="phone number">Phone Number:</label>
                <input type="tel" id="phone number" placeholder="503+ 0000-0000" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="********" required>
            </div>    
            <div class="form-group">
                <label for="Confirm Password">Confirm Password:</label>
                <input type="password" id="Confirm Password" placeholder="********" required>
            </div>

            <div class="gender">
                <input type="radio" id="Male" name="Gender" value="male" required>
                <label for="Male">Male</label>
                <input type="radio" id="Female" name="Gender" value="female" required>
                <label for="Female">Female</label>
                <input type="radio" id="Prefer not to say" name="Gender" value="prefer_not_to_say" required>
                <label for="Prefer not to say">Prefer not to say</label>
            </div>

          <button type="submit">REGISTER</button>
    </form>
    </div>
</body>
</html>
